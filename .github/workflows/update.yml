name: Actualisation Anomalies Ingress

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Exécution du scraper
        run: python tracker.py

      - name: Commit et push des résultats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/recap_anomaly.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour des scores Apollo" && git push)