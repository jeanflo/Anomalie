name: Déploiement Anomaly Hub

on:
  schedule:
    # Lundi à vendredi : 1 fois par jour à 12:00 UTC
    - cron: '0 12 * * 1-5'
    # Samedi et dimanche : toutes les 30 minutes
    - cron: '*/30 * * * 0,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Génération du Hub et des synthèses
        run: python tracker.py

      - name: Configuration GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Déploiement sur GitHub Pages
        uses: actions/deploy-pages@v4
