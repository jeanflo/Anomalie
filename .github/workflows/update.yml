name: Déploiement Anomaly Hub

on:
  schedule:
    # 1. Tous les lundis à 12:00 UTC
    - cron: '0 12 * * 1'

    # 2. Samedi : de 12:00 UTC à 23:30 UTC (toutes les 30 minutes)
    - cron: '*/30 12-23 * * 6'

    # 3. Dimanche : de 00:00 UTC à 12:00 UTC (toutes les 30 minutes)
    - cron: '0,30 0-11,12 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Génération du Hub et des synthèses
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tracker.py

      - name: Configuration GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Déploiement sur GitHub Pages
        uses: actions/deploy-pages@v4
